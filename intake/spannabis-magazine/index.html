<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparky — Spannabis Magazine</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a1a0a;color:#c8e6c8;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
  .container{max-width:560px;width:100%;text-align:center;}
  .sparky-name{font-size:1rem;color:#16a34a;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;}
  h1{font-size:1.8rem;color:#86efac;margin-bottom:.75rem;line-height:1.3;}
  .intro{color:#a3c4a3;font-size:1.05rem;margin-bottom:2.5rem;line-height:1.6;}
  .lang-choice{display:flex;gap:.75rem;justify-content:center;margin-bottom:2rem;}
  .lang-btn{background:#0f2a0f;border:2px solid #16a34a;color:#86efac;border-radius:10px;padding:.75rem 1.25rem;cursor:pointer;font-size:1rem;transition:background .2s;}
  .lang-btn:hover{background:#163a16;border-color:#86efac;}
  .lang-btn.active{background:#16a34a;color:#0a1a0a;font-weight:700;}
  .mode-choice{display:flex;flex-direction:column;gap:1rem;margin-bottom:2.5rem;}
  .mode-btn{background:#0f2a0f;border:2px solid #16a34a;color:#86efac;border-radius:12px;padding:1.25rem 1.5rem;cursor:pointer;text-align:left;transition:background .2s;}
  .mode-btn:hover{background:#163a16;border-color:#86efac;}
  .mode-btn .mode-title{font-size:1.1rem;font-weight:600;margin-bottom:.3rem;}
  .mode-btn .mode-desc{font-size:.9rem;color:#a3c4a3;}
  .question-text{font-size:1.2rem;color:#86efac;margin-bottom:2rem;line-height:1.5;min-height:3.5rem;}
  .record-btn{width:120px;height:120px;border-radius:50%;border:3px solid #16a34a;background:#0f2a0f;color:#86efac;font-size:3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;transition:all .2s;}
  .record-btn.recording{background:#3a0a0a;border-color:#ef4444;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4);}50%{box-shadow:0 0 0 16px rgba(239,68,68,0);}}
  .record-status{font-size:.95rem;color:#a3c4a3;margin-bottom:.5rem;min-height:1.4rem;}
  .record-timer{font-size:.85rem;color:#16a34a;margin-bottom:1.5rem;min-height:1.2rem;}
  audio{width:100%;margin-bottom:1rem;}
  .next-btn{display:none;background:#16a34a;color:#0a1a0a;border:none;border-radius:8px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;}
  .next-btn:hover{background:#86efac;}
  .done-msg{display:none;color:#86efac;font-size:1.1rem;line-height:1.8;}
  .back-link{display:inline-block;margin-top:2rem;color:#16a34a;font-size:.85rem;cursor:pointer;text-decoration:underline;}
  .share-pitch{background:#0f2a0f;border:1px solid #16a34a;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;text-align:left;}
  .share-pitch p{font-size:.95rem;color:#a3c4a3;line-height:1.6;}
  .upload-area{border:2px dashed #16a34a;border-radius:10px;padding:1.25rem;margin-bottom:1rem;cursor:pointer;position:relative;}
  .upload-area:hover{background:#0f2a0f;}
  .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .upload-label{font-size:1rem;font-weight:600;color:#86efac;margin-bottom:.3rem;}
  .upload-desc{font-size:.85rem;color:#a3c4a3;}
  .upload-files{font-size:.85rem;color:#16a34a;margin-top:.5rem;min-height:1.2rem;}
  .share-actions{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem;}
  .share-btn{background:#16a34a;color:#0a1a0a;border:none;border-radius:8px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;}
  .share-btn:hover{background:#86efac;}
  .skip-link{color:#16a34a;font-size:.85rem;cursor:pointer;text-decoration:underline;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="container">
  <div id="lang-screen">
    <p class="sparky-name">Sparky</p>
    <h1>Hola Jorge. Welcome.</h1>
    <p class="intro" style="margin-bottom:1.5rem;">Choose your language / Elige tu idioma.</p>
    <div class="lang-choice">
      <button class="lang-btn active" onclick="setLang('en',this)">🇬🇧 English</button>
      <button class="lang-btn" onclick="setLang('de',this)">🇩🇪 Deutsch</button>
      <button class="lang-btn" onclick="setLang('es',this)">🇪🇸 Español</button>
    </div>
    <button class="mode-btn" style="text-align:center;margin-top:.5rem;" onclick="goToIntro()"><div class="mode-title">Continue →</div></button>
  </div>
  <div id="intro-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="intro-title"></h1><p class="intro" id="intro-body"></p><div class="mode-choice"><button class="mode-btn" onclick="startMode('interview')"><div class="mode-title" id="mode-interview-title"></div><div class="mode-desc" id="mode-interview-desc"></div></button><button class="mode-btn" onclick="startMode('free')"><div class="mode-title" id="mode-free-title"></div><div class="mode-desc" id="mode-free-desc"></div></button></div></div>
  <div id="share-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="share-title"></h1><div class="share-pitch"><p id="share-pitch-text"></p></div><div class="upload-area"><input type="file" id="public-upload" multiple accept=".pdf,.csv,.txt,.jpg,.png" onchange="showFiles('public-upload','public-files')"><div class="upload-label" id="share-public-label"></div><div class="upload-desc" id="share-public-desc"></div><div class="upload-files" id="public-files"></div></div><div class="upload-area"><input type="file" id="private-upload" multiple accept=".pdf,.csv,.txt,.jpg,.png" onchange="showFiles('private-upload','private-files')"><div class="upload-label" id="share-private-label"></div><div class="upload-desc" id="share-private-desc"></div><div class="upload-files" id="private-files"></div></div><div class="share-actions"><button class="share-btn" onclick="finishSession()" id="share-send-btn"></button><span class="skip-link" onclick="finishSession()" id="share-skip-link"></span></div></div>
  <div id="offer-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="offer-title"></h1><p class="intro" id="offer-intro"></p><div style="background:#0f2a0f;border:2px solid #16a34a;border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;text-align:left;"><p style="font-size:1.1rem;font-weight:700;color:#86efac;margin-bottom:1rem;" id="offer-trial-headline"></p><ul style="list-style:none;padding:0;color:#c8e6c8;font-size:.95rem;line-height:2;" id="offer-features"></ul></div><div style="background:#0a1a0a;border:1px solid #16a34a;border-radius:10px;padding:1rem;margin-bottom:1.5rem;text-align:left;"><p style="font-size:.9rem;color:#a3c4a3;margin-bottom:.5rem;" id="offer-pricing-label"></p><p style="font-size:1.4rem;font-weight:700;color:#86efac;" id="offer-price-monthly"></p><p style="font-size:.85rem;color:#16a34a;margin-top:.25rem;" id="offer-price-annual"></p></div><div style="background:#0f2a0f;border:1px solid #16a34a;border-radius:10px;padding:1rem;margin-bottom:1.5rem;text-align:left;"><p style="font-size:.95rem;color:#86efac;font-style:italic;line-height:1.6;" id="offer-flywheel"></p></div><div class="share-actions"><button class="share-btn" onclick="acceptOffer()" id="offer-accept-btn"></button><span class="skip-link" onclick="declineOffer()" id="offer-static-btn"></span></div></div>
  <div id="recorder-screen" class="hidden"><p class="sparky-name">Sparky</p><p class="question-text" id="question-text"></p><button class="record-btn" id="record-btn" onclick="toggleRecording()">🎙️</button><p class="record-status" id="record-status"></p><p class="record-timer" id="record-timer"></p><div id="playback" class="hidden"><audio id="audio-player" controls></audio><button class="next-btn" id="next-btn" onclick="nextQuestion()"></button></div><div class="done-msg" id="done-msg"></div><span class="back-link" id="back-link" onclick="resetAll()"></span></div>
</div>
<script>
  const COPY={
    en:{
      introTitle:"Tell me about Spannabis Magazine.",
      introBody:"I'll listen. Nothing you say leaves this room.",
      modeInterviewTitle:"🎙️ Let Sparky ask the questions",modeInterviewDesc:"One question at a time. About 10 minutes.",
      modeFreeTitle:"💬 I'll just talk",modeFreeDesc:"Hit record and tell me what's on your mind.",
      tapToRecord:"Tap to start recording",recording:"Recording… tap to stop",
      recorded:s=>`Recorded (${s}s). Listen back, then continue.`,
      nextGood:"That's good →",nextDone:"Done ✓",backLink:"← Start again",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">That's everything for now. 🌿</p><p style="color:#a3c4a3;font-size:1.05rem;line-height:1.7;"><strong style="color:#86efac;">Don't panic. We've got you.</strong></p>`,
      micDenied:"Microphone access denied.",noSupport:"Try Chrome or Safari.",
      questions:[
        "Spannabis Magazine covers the cannabis industry from inside Spain — and Spain has a genuinely unique relationship with cannabis. What does that position give you as a media outlet that a UK or US publication simply can't have?",
        "You've watched the industry evolve from the early cannabis social club era to the current regulated moment. What's the single biggest shift you've seen in how the industry presents itself — and how readers respond?",
        "What story is the industry not telling itself right now — the thing that's happening that nobody is writing about?",
        "How do you see media and community platforms working together? cannabin-oid is building a village — what role could Spannabis Magazine play in that?",
        "What would you want UK cannabis patients to know about Spain that they probably don't?"
      ],
      freePrompt:"Hit record whenever you're ready. Tell me about Spannabis Magazine — the mission, the audience, what you cover.",
      shareTitle:"Got content to share?",
      sharePitch:"Ask Terp answers questions from UK cannabis patients every day. Spannabis Magazine content — articles, insights, the Spanish perspective — would make those answers richer. What do you want the cannabin-oid community to read?",
      sharePublicLabel:"🌿 Share with Ask Terp",sharePublicDesc:"Articles, insights, perspectives the UK community would benefit from.",
      sharePrivateLabel:"🔒 Keep this private",sharePrivateDesc:"Subscriber data, internal editorial. Only your hamlet team.",
      shareSend:"Send it →",shareSkip:"Nothing to share right now — skip",
      offerTitle:"Here's your deal.",offerIntro:"Two media outlets. Same audience. Different angles. This makes sense.",
      offerTrialHeadline:"🎁 First week completely free. Full access. No card needed.",
      offerFeatures:["✅ Your own hamlet page on cannabin-oid.co.uk","✅ Ask Terp references Spannabis Magazine when relevant","✅ Voice intake — your story, your editorial angle, built in","✅ Your content in the platform","✅ Cross-promotion to UK patients who don't know you yet.","✅ You send us your readers. We send you ours."],
      offerPricingLabel:"After your free week:",offerPriceMonthly:"£99.95 / month",
      offerPriceAnnual:"Or £999 / year — 10 months, 2 months free.",
      offerFlywheel:"\"Send me your readers. I'll send you mine.\"",
      offerAccept:"Start my free week →",offerStatic:"Not ready yet — just a free static listing for now"
    },
    es:{
      introTitle:"Cuéntame sobre Spannabis Magazine.",
      introBody:"Te escucho. Nada sale de aquí.",
      modeInterviewTitle:"🎙️ Deja que Sparky pregunte",modeInterviewDesc:"Una pregunta a la vez. Unos 10 minutos.",
      modeFreeTitle:"💬 Prefiero hablar libremente",modeFreeDesc:"Dale a grabar y cuéntame.",
      tapToRecord:"Toca para grabar",recording:"Grabando… toca para parar",
      recorded:s=>`Grabado (${s}s). Escucha y continúa.`,
      nextGood:"Bien →",nextDone:"Listo ✓",backLink:"← Empezar de nuevo",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">Eso es todo por ahora. 🌿</p><p style="color:#a3c4a3;font-size:1.05rem;line-height:1.7;"><strong style="color:#86efac;">No te preocupes. Te tenemos.</strong></p>`,
      micDenied:"Acceso al micrófono denegado.",noSupport:"Prueba Chrome o Safari.",
      questions:[
        "Spannabis Magazine cubre la industria del cannabis desde España — y España tiene una relación genuinamente única con el cannabis. ¿Qué te da esa posición como medio que una publicación del Reino Unido o de EEUU simplemente no puede tener?",
        "Has visto evolucionar la industria desde la era de los primeros clubs sociales hasta el momento regulado actual. ¿Cuál es el mayor cambio que has visto en cómo la industria se presenta a sí misma?",
        "¿Qué historia NO se está contando la industria ahora mismo — algo que esté pasando y que nadie esté escribiendo?",
        "¿Cómo ves que los medios y las plataformas comunitarias trabajen juntos? cannabin-oid está construyendo un pueblo — ¿qué papel podría jugar Spannabis Magazine en eso?",
        "¿Qué querrías que los pacientes de cannabis del Reino Unido supieran sobre España que probablemente no saben?"
      ],
      freePrompt:"Dale a grabar cuando estés listo. Cuéntame sobre Spannabis Magazine — la misión, la audiencia, lo que cubres.",
      shareTitle:"¿Tienes contenido que compartir?",
      sharePitch:"Ask Terp responde preguntas de pacientes de cannabis del Reino Unido cada día. El contenido de Spannabis Magazine haría esas respuestas más ricas. ¿Qué quieres que lea la comunidad cannabin-oid?",
      sharePublicLabel:"🌿 Compartir con Ask Terp",sharePublicDesc:"Artículos, perspectivas, contenido que beneficiaría a la comunidad del UK.",
      sharePrivateLabel:"🔒 Mantener privado",sharePrivateDesc:"Datos de suscriptores, editorial interno.",
      shareSend:"Enviar →",shareSkip:"Nada que compartir — saltar",
      offerTitle:"Tu oferta.",offerIntro:"Dos medios. La misma audiencia. Ángulos diferentes. Tiene sentido.",
      offerTrialHeadline:"🎁 Primera semana completamente gratis. Acceso completo. Sin tarjeta.",
      offerFeatures:["✅ Tu propia página hamlet en cannabin-oid.co.uk","✅ Ask Terp menciona Spannabis Magazine cuando es relevante","✅ Voice Intake — tu historia, tu ángulo editorial, integrado","✅ Tu contenido en la plataforma","✅ Promoción cruzada con pacientes del UK que aún no te conocen.","✅ Tú nos mandas tus lectores. Nosotros te mandamos los nuestros."],
      offerPricingLabel:"Después de tu semana gratis:",offerPriceMonthly:"£99.95 / mes",
      offerPriceAnnual:"O £999 / año — 10 meses, 2 meses gratis.",
      offerFlywheel:"\"Mándame tus lectores. Yo te mando los míos.\"",
      offerAccept:"Empezar mi semana gratis →",offerStatic:"Aún no — solo página estática gratuita por ahora"
    },
    de:{
      introTitle:"Erzähl mir vom Spannabis Magazine.",introBody:"Ich höre zu.",
      modeInterviewTitle:"🎙️ Sparky stellt die Fragen",modeInterviewDesc:"Eine Frage nach der anderen.",
      modeFreeTitle:"💬 Ich rede einfach",modeFreeDesc:"Drück auf Aufnehmen.",
      tapToRecord:"Tippen zum Aufnehmen",recording:"Aufnahme läuft…",recorded:s=>`Aufgenommen (${s}s).`,
      nextGood:"Gut so →",nextDone:"Fertig ✓",backLink:"← Neu starten",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">Das ist alles. 🌿</p><p style="color:#a3c4a3;"><strong style="color:#86efac;">Wir haben dich.</strong></p>`,
      micDenied:"Mikrofonzugriff verweigert.",noSupport:"Chrome oder Safari.",
      questions:["Was gibt euch die Perspektive aus Spanien, die britische oder amerikanische Medien nicht haben?","Welche Veränderung habt ihr in der Selbstdarstellung der Industrie gesehen?","Welche Geschichte erzählt sich die Industrie gerade nicht?","Wie könnten Medien und Community-Plattformen zusammenarbeiten?","Was sollten UK-Patienten über Spanien wissen?"],
      freePrompt:"Erzähl mir vom Spannabis Magazine.",shareTitle:"Inhalte teilen?",sharePitch:"Ask Terp-Antworten würden von Spannabis Magazine-Inhalten profitieren.",
      sharePublicLabel:"🌿 Mit Ask Terp teilen",sharePublicDesc:"Artikel, Perspektiven.",sharePrivateLabel:"🔒 Privat",sharePrivateDesc:"Abonnentendaten.",
      shareSend:"Absenden →",shareSkip:"Nichts zu teilen — überspringen",
      offerTitle:"Dein Angebot.",offerIntro:"Zwei Medien. Dieselbe Zielgruppe. Verschiedene Blickwinkel.",
      offerTrialHeadline:"🎁 Erste Woche gratis.",
      offerFeatures:["✅ Hamlet-Seite auf cannabin-oid.co.uk","✅ Ask Terp erwähnt Spannabis Magazine","✅ Voice Intake","✅ Inhalte in der Plattform","✅ Cross-Promotion mit UK-Patienten.","✅ Du schickst uns deine Leser. Wir schicken dir unsere."],
      offerPricingLabel:"Nach der Gratiswoche:",offerPriceMonthly:"£99.95 / Monat",offerPriceAnnual:"Oder £999 / Jahr.",
      offerFlywheel:'„Schick mir deine Leser. Ich schicke dir meine.',offerAccept:"Gratiswoche starten →",offerStatic:"Noch nicht — kostenlose Seite"
    }
  };
  let lang='en',mode=null,currentQ=0,mediaRecorder=null,audioChunks=[],recordingTimer=null,recordingSeconds=0,micStream=null;
  const MAX_RECORDING=180;
  function setLang(l,btn){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  function goToIntro(){const c=COPY[lang];document.getElementById('intro-title').textContent=c.introTitle;document.getElementById('intro-body').textContent=c.introBody;document.getElementById('mode-interview-title').textContent=c.modeInterviewTitle;document.getElementById('mode-interview-desc').textContent=c.modeInterviewDesc;document.getElementById('mode-free-title').textContent=c.modeFreeTitle;document.getElementById('mode-free-desc').textContent=c.modeFreeDesc;document.getElementById('lang-screen').classList.add('hidden');document.getElementById('intro-screen').classList.remove('hidden');}
  function startMode(m){mode=m;currentQ=0;document.getElementById('intro-screen').classList.add('hidden');document.getElementById('recorder-screen').classList.remove('hidden');document.getElementById('back-link').textContent=COPY[lang].backLink;document.getElementById('record-status').textContent=COPY[lang].tapToRecord;showQuestion();}
  function showQuestion(){document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';document.getElementById('playback').classList.add('hidden');document.getElementById('next-btn').style.display='none';document.getElementById('done-msg').style.display='none';document.getElementById('record-status').textContent=COPY[lang].tapToRecord;document.getElementById('record-timer').textContent='';document.getElementById('question-text').textContent=mode==='free'?COPY[lang].freePrompt:COPY[lang].questions[currentQ];}
  function nextQuestion(){document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';if(mode==='free'){endSession();return;}currentQ++;if(currentQ>=COPY[lang].questions.length)endSession();else showQuestion();}
  function endSession(){releaseMic();document.getElementById('recorder-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('share-title').textContent=c.shareTitle;document.getElementById('share-pitch-text').innerHTML=c.sharePitch;document.getElementById('share-public-label').textContent=c.sharePublicLabel;document.getElementById('share-public-desc').textContent=c.sharePublicDesc;document.getElementById('share-private-label').textContent=c.sharePrivateLabel;document.getElementById('share-private-desc').textContent=c.sharePrivateDesc;document.getElementById('share-send-btn').textContent=c.shareSend;document.getElementById('share-skip-link').textContent=c.shareSkip;document.getElementById('share-screen').classList.remove('hidden');}
  function finishSession(){document.getElementById('share-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('offer-title').textContent=c.offerTitle;document.getElementById('offer-intro').textContent=c.offerIntro;document.getElementById('offer-trial-headline').textContent=c.offerTrialHeadline;document.getElementById('offer-features').innerHTML=c.offerFeatures.map(f=>`<li>${f}</li>`).join('');document.getElementById('offer-pricing-label').textContent=c.offerPricingLabel;document.getElementById('offer-price-monthly').textContent=c.offerPriceMonthly;document.getElementById('offer-price-annual').textContent=c.offerPriceAnnual;document.getElementById('offer-flywheel').textContent=c.offerFlywheel;document.getElementById('offer-accept-btn').textContent=c.offerAccept;document.getElementById('offer-static-btn').textContent=c.offerStatic;document.getElementById('offer-screen').classList.remove('hidden');}
  function acceptOffer(){document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=COPY[lang].doneMsg;document.getElementById('done-msg').style.display='block';}
  function declineOffer(){document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem;margin-bottom:1rem;">That's everything. 🌿</p><p style="color:#a3c4a3;"><strong style="color:#86efac;">Free static page incoming.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function showFiles(i,d){document.getElementById(d).textContent=Array.from(document.getElementById(i).files).map(f=>f.name).join(', ')||'';}
  function resetAll(){stopRecording();releaseMic();mode=null;currentQ=0;document.getElementById('lang-screen').classList.remove('hidden');['intro-screen','recorder-screen'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById('done-msg').style.display='none';}
  async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording();else await startRecording();}
  async function startRecording(){const c=COPY[lang];if(!navigator.mediaDevices){document.getElementById('record-status').textContent=c.noSupport;return;}try{if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(micStream);mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{document.getElementById('audio-player').src=URL.createObjectURL(new Blob(audioChunks,{type:'audio/webm'}));document.getElementById('playback').classList.remove('hidden');const nb=document.getElementById('next-btn');nb.style.display='inline-block';nb.textContent=(mode==='free'||currentQ>=COPY[lang].questions.length-1)?c.nextDone:c.nextGood;document.getElementById('record-status').textContent=c.recorded(recordingSeconds);uploadRecording(audioBlob,recordingSeconds);};mediaRecorder.start(100);recordingSeconds=0;document.getElementById('record-btn').classList.add('recording');document.getElementById('record-btn').innerHTML='⏹';document.getElementById('record-status').textContent=c.recording;recordingTimer=setInterval(()=>{recordingSeconds++;document.getElementById('record-timer').textContent=recordingSeconds+'s';if(recordingSeconds>=MAX_RECORDING)stopRecording();},1000);}catch(e){document.getElementById('record-status').textContent=c.micDenied;}}
  function stopRecording(){if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null;}if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();document.getElementById('record-btn').classList.remove('recording');document.getElementById('record-btn').innerHTML='🎙️';document.getElementById('record-timer').textContent='';}
  function releaseMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
  function uploadRecording(blob,durationSeconds){const reader=new FileReader();reader.onloadend=()=>{const base64=reader.result.split(',')[1];fetch('/.netlify/functions/save-intake-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'spannabis-magazine',questionIndex:currentQ,mode:mode,lang:lang,audioBase64:base64,durationSeconds:durationSeconds,mimeType:'audio/webm'})}).catch(err=>console.warn('Recording upload failed:',err));};reader.readAsDataURL(blob);}
</script>
</body>
</html>

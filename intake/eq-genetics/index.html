<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparky — EQ Genetics</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a1a0a;
    color: #c8e6c8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container { max-width: 560px; width: 100%; text-align: center; }
  .sparky-name { font-size: 1rem; color: #16a34a; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem; }
  h1 { font-size: 1.8rem; color: #86efac; margin-bottom: 0.75rem; line-height: 1.3; }
  .intro { color: #a3c4a3; font-size: 1.05rem; margin-bottom: 2.5rem; line-height: 1.6; }

  /* LANGUAGE */
  .lang-choice { display: flex; gap: 0.75rem; justify-content: center; margin-bottom: 2rem; }
  .lang-btn {
    background: #0f2a0f; border: 2px solid #16a34a; color: #86efac;
    border-radius: 10px; padding: 0.75rem 1.25rem; cursor: pointer;
    font-size: 1rem; transition: background 0.2s, border-color 0.2s;
  }
  .lang-btn:hover { background: #163a16; border-color: #86efac; }
  .lang-btn.active { background: #16a34a; color: #0a1a0a; font-weight: 700; }

  /* MODE */
  .mode-choice { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2.5rem; }
  .mode-btn {
    background: #0f2a0f; border: 2px solid #16a34a; color: #86efac;
    border-radius: 12px; padding: 1.25rem 1.5rem; cursor: pointer; text-align: left;
    transition: background 0.2s, border-color 0.2s;
  }
  .mode-btn:hover { background: #163a16; border-color: #86efac; }
  .mode-btn .mode-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.3rem; }
  .mode-btn .mode-desc { font-size: 0.9rem; color: #a3c4a3; }

  /* RECORDER */
  .question-text { font-size: 1.2rem; color: #86efac; margin-bottom: 2rem; line-height: 1.5; min-height: 3.5rem; }
  .record-btn {
    width: 120px; height: 120px; border-radius: 50%;
    border: 3px solid #16a34a; background: #0f2a0f; color: #86efac;
    font-size: 3rem; cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem;
  }
  .record-btn:hover { background: #163a16; border-color: #86efac; }
  .record-btn.recording { background: #3a0a0a; border-color: #ef4444; animation: pulse 1.2s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
  }
  .record-status { font-size: 0.95rem; color: #a3c4a3; margin-bottom: 0.5rem; min-height: 1.4rem; }
  .record-timer { font-size: 0.85rem; color: #16a34a; margin-bottom: 1.5rem; min-height: 1.2rem; }
  audio { width: 100%; margin-bottom: 1rem; }
  .next-btn {
    display: none; background: #16a34a; color: #0a1a0a;
    border: none; border-radius: 8px; padding: 0.85rem 2rem;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .next-btn:hover { background: #86efac; }
  .done-msg { display: none; color: #86efac; font-size: 1.1rem; line-height: 1.8; }
  .back-link { display: inline-block; margin-top: 2rem; color: #16a34a; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }

  /* SHARE SCREEN */
  .share-pitch { background: #0f2a0f; border: 1px solid #16a34a; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; text-align: left; }
  .share-pitch p { font-size: 0.95rem; color: #a3c4a3; line-height: 1.6; }
  .share-pitch strong { color: #86efac; }
  .upload-area {
    border: 2px dashed #16a34a; border-radius: 10px; padding: 1.25rem;
    margin-bottom: 1rem; cursor: pointer; transition: background 0.2s;
    position: relative;
  }
  .upload-area:hover { background: #0f2a0f; }
  .upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-label { font-size: 1rem; font-weight: 600; color: #86efac; margin-bottom: 0.3rem; }
  .upload-desc { font-size: 0.85rem; color: #a3c4a3; }
  .upload-files { font-size: 0.85rem; color: #16a34a; margin-top: 0.5rem; min-height: 1.2rem; }
  .share-actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.5rem; }
  .share-btn {
    background: #16a34a; color: #0a1a0a; border: none;
    border-radius: 8px; padding: 0.85rem 2rem;
    font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s;
  }
  .share-btn:hover { background: #86efac; }
  .skip-link { color: #16a34a; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  .offer-btn {
    background: transparent; color: #86efac;
    border: 2px solid #16a34a; border-radius: 8px;
    padding: 0.85rem 2rem; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background 0.2s; width: 100%;
  }
  .offer-btn:hover { background: #0f2a0f; }

  .hidden { display: none !important; }
</style>

  </div>

  <!-- INTRO / MODE SELECT -->

        <div class="mode-title" id="mode-free-title"></div>
        <div class="mode-desc" id="mode-free-desc"></div>
      </button>
    </div>
  </div>

  <!-- SHARE SCREEN -->
  <div id="share-screen" class="hidden">
    <p class="sparky-name">Sparky</p>
    <h1 id="share-title"></h1>
    <div class="share-pitch"><p id="share-pitch-text"></p></div>

    <div class="upload-area">

      <div class="upload-desc" id="share-public-desc"></div>
      <div class="upload-files" id="public-files"></div>
    </div>

    <div class="upload-area">

      <div class="upload-label" id="share-private-label"></div>
      <div class="upload-desc" id="share-private-desc"></div>
      <div class="upload-files" id="private-files"></div>
    </div>

    <div class="share-actions">
      <button class="share-btn" onclick="finishSession()" id="share-send-btn"></button>
      <span class="skip-link" onclick="finishSession()" id="share-skip-link"></span>
    </div>
  </div>

  <!-- OFFER SCREEN -->
  <div id="offer-screen" class="hidden">
    <p class="sparky-name">Sparky</p>
    <h1 id="offer-title"></h1>
    <p class="intro" id="offer-intro"></p>

    <div style="background:#0f2a0f; border:2px solid #16a34a; border-radius:14px; padding:1.5rem; margin-bottom:1.25rem; text-align:left;">
      <p style="font-size:1.1rem; font-weight:700; color:#86efac; margin-bottom:1rem;" id="offer-trial-headline"></p>
      <ul style="list-style:none; padding:0; color:#c8e6c8; font-size:0.95rem; line-height:2;" id="offer-features"></ul>
    </div>

    <div style="background:#0a1a0a; border:1px solid #16a34a; border-radius:10px; padding:1rem; margin-bottom:1.5rem; text-align:left;">
      <p style="font-size:0.9rem; color:#a3c4a3; margin-bottom:0.5rem;" id="offer-pricing-label"></p>
      <p style="font-size:1.4rem; font-weight:700; color:#86efac;" id="offer-price-monthly"></p>
      <p style="font-size:0.85rem; color:#16a34a; margin-top:0.25rem;" id="offer-price-annual"></p>
    </div>

    <div style="background:#0f2a0f; border:1px solid #16a34a; border-radius:10px; padding:1rem; margin-bottom:1.5rem; text-align:left;">
      <p style="font-size:0.95rem; color:#86efac; font-style:italic; line-height:1.6;" id="offer-flywheel"></p>
    </div>

    <div class="share-actions">
      <button class="share-btn" onclick="declineOffer()" id="offer-static-btn"></button>
      <button class="offer-btn" onclick="acceptOffer()" id="offer-accept-btn"></button>
    </div>
  </div>

  <!-- RECORDER -->
  <div id="recorder-screen" class="hidden">
    <p class="sparky-name">Sparky</p>
    <p class="question-text" id="question-text"></p>
    <button class="record-btn" id="record-btn" onclick="toggleRecording()" aria-label="Start recording">🎙️</button>
    <p class="record-status" id="record-status"></p>
    <p class="record-timer" id="record-timer"></p>
    <div id="playback" class="hidden">
      <audio id="audio-player" controls></audio>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()"></button>
    </div>
    <div class="done-msg" id="done-msg"></div>
    <span class="back-link" id="back-link" onclick="resetAll()"></span>
  </div>

</div>

  // ── LANGUAGE ──────────────────────────────────────────────────────────────
  function setLang(l, btn) {

  function goToIntro() {

  // ── MODE ──────────────────────────────────────────────────────────────────

    playback.classList.add('hidden');
    nextBtn.style.display = 'none';
    doneMsg.style.display = 'none';
    document.getElementById('record-status').textContent = c.tapToRecord;
    document.getElementById('record-timer').textContent = '';
    audioBlob = null;

    document.getElementById('question-text').textContent =
      mode === 'free' ? c.freePrompt : c.questions[currentQ];
  }

  function nextQuestion() {
    const player = document.getElementById('audio-player');
    player.pause(); player.src = '';
    if (mode === 'free') { endSession(); return; }
    currentQ++;
    if (currentQ >= COPY[lang].questions.length) { endSession(); } else { showQuestion(); }
  }

  function endSession() {
    releaseMic();
    document.getElementById('recorder-screen').classList.add('hidden');
    const c = COPY[lang];
    document.getElementById('share-title').textContent = c.shareTitle;
    document.getElementById('share-pitch-text').innerHTML = c.sharePitch;
    document.getElementById('share-public-label').textContent = c.sharePublicLabel;
    document.getElementById('share-public-desc').textContent = c.sharePublicDesc;
    document.getElementById('share-private-label').textContent = c.sharePrivateLabel;
    document.getElementById('share-private-desc').textContent = c.sharePrivateDesc;
    document.getElementById('share-send-btn').textContent = c.shareSend;
    document.getElementById('share-skip-link').textContent = c.shareSkip;
    document.getElementById('share-screen').classList.remove('hidden');
  }

  function finishSession() {
    document.getElementById('share-screen').classList.add('hidden');
    // TODO: upload public-upload and private-upload files to Supabase storage
    const c = COPY[lang];
    document.getElementById('offer-title').textContent = c.offerTitle;
    document.getElementById('offer-intro').textContent = c.offerIntro;
    document.getElementById('offer-trial-headline').textContent = c.offerTrialHeadline;
    const ul = document.getElementById('offer-features');
    ul.innerHTML = c.offerFeatures.map(f => `<li>${f}</li>`).join('');
    document.getElementById('offer-pricing-label').textContent = c.offerPricingLabel;
    document.getElementById('offer-price-monthly').textContent = c.offerPriceMonthly;
    document.getElementById('offer-price-annual').textContent = c.offerPriceAnnual;
    document.getElementById('offer-flywheel').textContent = c.offerFlywheel;
    document.getElementById('offer-accept-btn').textContent = c.offerAccept;
    document.getElementById('offer-static-btn').textContent = c.offerStatic;
    document.getElementById('offer-screen').classList.remove('hidden');
  }

  function acceptOffer() {
    document.getElementById('offer-screen').classList.add('hidden');
    document.getElementById('done-msg').innerHTML = COPY[lang].doneMsg;
    document.getElementById('done-msg').style.display = 'block';
    // TODO: record acceptance in Supabase, trigger welcome email
  }

  function declineOffer() {
    document.getElementById('offer-screen').classList.add('hidden');
    const c = COPY[lang];
    document.getElementById('done-msg').innerHTML = `
      <p style="font-size:1.4rem; margin-bottom:1rem;">That's everything for now. 🌿</p>
      <p style="color:#a3c4a3; font-size:1.05rem; line-height:1.7;">
        We'll get your static page live. No rush on the rest — it'll be here when you're ready.<br><br>
        <strong style="color:#86efac;">Don't panic. We've got you.</strong>
      </p>`;
    document.getElementById('done-msg').style.display = 'block';
    // TODO: record static preference in Supabase
  }

  function showFiles(inputId, displayId) {
    const files = document.getElementById(inputId).files;
    const names = Array.from(files).map(f => f.name).join(', ');
    document.getElementById(displayId).textContent = names || '';
  }

  function resetAll() {
    stopRecording(); releaseMic();
    const player = document.getElementById('audio-player');
    player.pause(); player.src = '';
    mode = null; currentQ = 0; audioBlob = null;
    document.getElementById('lang-screen').classList.remove('hidden');
    document.getElementById('intro-screen').classList.add('hidden');
    document.getElementById('recorder-screen').classList.add('hidden');
    document.getElementById('record-btn').style.display = 'flex';
    document.getElementById('done-msg').style.display = 'none';
  }

  // ── RECORDING ─────────────────────────────────────────────────────────────
  async function toggleRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') { stopRecording(); }
    else { await startRecording(); }
  }

  async function startRecording() {
    const c = COPY[lang];
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('record-status').textContent = c.noSupport; return;
    }
    try {
      if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = []; audioBlob = null;
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(audioBlob);
        const player = document.getElementById('audio-player');
        player.src = url;
        document.getElementById('playback').classList.remove('hidden');
        const nextBtn = document.getElementById('next-btn');
        nextBtn.style.display = 'inline-block';
        const isLast = mode === 'free' || currentQ >= COPY[lang].questions.length - 1;
        nextBtn.textContent = isLast ? c.nextDone : c.nextGood;
        document.getElementById('record-status').textContent = c.recorded(recordingSeconds);
        uploadRecording(audioBlob, recordingSeconds);
      };
      mediaRecorder.start(100);
      recordingSeconds = 0;
      const btn = document.getElementById('record-btn');
      btn.classList.add('recording'); btn.innerHTML = '⏹';
      document.getElementById('record-status').textContent = c.recording;
      document.getElementById('record-timer').textContent = '';
      recordingTimer = setInterval(() => {
        recordingSeconds++;
        document.getElementById('record-timer').textContent = recordingSeconds + 's';
        if (recordingSeconds >= MAX_RECORDING) stopRecording();
      }, 1000);
    } catch (e) {
      document.getElementById('record-status').textContent = COPY[lang].micDenied;
    }
  }

  function stopRecording() {
    if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    const btn = document.getElementById('record-btn');
    btn.classList.remove('recording'); btn.innerHTML = '🎙️';
    document.getElementById('record-timer').textContent = '';
  }

  function releaseMic() {
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  }
  function uploadRecording(blob,durationSeconds){const reader=new FileReader();reader.onloadend=()=>{const base64=reader.result.split(',')[1];fetch('/.netlify/functions/save-intake-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'eq-genetics',questionIndex:currentQ,mode:mode,lang:lang,audioBase64:base64,durationSeconds:durationSeconds,mimeType:'audio/webm'})}).catch(err=>console.warn('Recording upload failed:',err));};reader.readAsDataURL(blob);}
</script>
</body>

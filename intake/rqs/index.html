  function nextQuestion(){document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';if(mode==='free'){endSession();return;}currentQ++;if(currentQ>=COPY[lang].questions.length){endSession();}else{showQuestion();}}
  function endSession(){releaseMic();document.getElementById('recorder-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('share-title').textContent=c.shareTitle;document.getElementById('share-pitch-text').innerHTML=c.sharePitch;document.getElementById('share-public-label').textContent=c.sharePublicLabel;document.getElementById('share-public-desc').textContent=c.sharePublicDesc;document.getElementById('share-private-label').textContent=c.sharePrivateLabel;document.getElementById('share-private-desc').textContent=c.sharePrivateDesc;document.getElementById('share-send-btn').textContent=c.shareSend;document.getElementById('share-skip-link').textContent=c.shareSkip;document.getElementById('share-screen').classList.remove('hidden');}
  function finishSession(){document.getElementById('share-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('offer-title').textContent=c.offerTitle;document.getElementById('offer-intro').textContent=c.offerIntro;document.getElementById('offer-trial-headline').textContent=c.offerTrialHeadline;const ul=document.getElementById('offer-features');ul.innerHTML=c.offerFeatures.map(f=>`<li>${f}</li>`).join('');document.getElementById('offer-pricing-label').textContent=c.offerPricingLabel;document.getElementById('offer-price-monthly').textContent=c.offerPriceMonthly;document.getElementById('offer-price-annual').textContent=c.offerPriceAnnual;document.getElementById('offer-flywheel').textContent=c.offerFlywheel;document.getElementById('offer-accept-btn').textContent=c.offerAccept;document.getElementById('offer-static-btn').textContent=c.offerStatic;document.getElementById('offer-screen').classList.remove('hidden');}
  function acceptOffer(){window.open('https://wa.me/447976884254?text=Hi+Chris%2C+it%27s+Daniel+from+Royal+Queen+Seeds.+I+want+a+SpicyDrive.','_blank');document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem; margin-bottom:1rem;">On its way. 🌿</p><p style="color:#a3c4a3; font-size:1.05rem; line-height:1.7;">Chris will come back to you directly.<br><br><strong style="color:#86efac;">The others will follow. We will be here waiting for them.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function declineOffer(){document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem; margin-bottom:1rem;">Grateful you are here. 🌿</p><p style="color:#a3c4a3; font-size:1.05rem; line-height:1.7;">Your piece of the jigsaw is noted. When it feels right, you will know where to find us.<br><br><strong style="color:#86efac;">The others will follow. We will be here waiting for them.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function showFiles(inputId,displayId){const files=document.getElementById(inputId).files;document.getElementById(displayId).textContent=Array.from(files).map(f=>f.name).join(', ')||'';}
  function resetAll(){stopRecording();releaseMic();document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';mode=null;currentQ=0;audioBlob=null;document.getElementById('lang-screen').classList.remove('hidden');document.getElementById('intro-screen').classList.add('hidden');document.getElementById('recorder-screen').classList.add('hidden');document.getElementById('record-btn').style.display='flex';document.getElementById('done-msg').style.display='none';}
  async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){stopRecording();}else{await startRecording();}}
  async function startRecording(){const c=COPY[lang];if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('record-status').textContent=c.noSupport;return;}try{if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];audioBlob=null;mediaRecorder=new MediaRecorder(micStream);mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{audioBlob=new Blob(audioChunks,{type:'audio/webm'});const url=URL.createObjectURL(audioBlob);const player=document.getElementById('audio-player');player.src=url;document.getElementById('playback').classList.remove('hidden');const nb=document.getElementById('next-btn');nb.style.display='inline-block';const isLast=mode==='free'||currentQ>=COPY[lang].questions.length-1;nb.textContent=isLast?c.nextDone:c.nextGood;document.getElementById('record-status').textContent=c.recorded(recordingSeconds);uploadRecording(audioBlob,recordingSeconds);};mediaRecorder.start(100);recordingSeconds=0;const btn=document.getElementById('record-btn');btn.classList.add('recording');btn.innerHTML='⏹';document.getElementById('record-status').textContent=c.recording;document.getElementById('record-timer').textContent='';recordingTimer=setInterval(()=>{recordingSeconds++;document.getElementById('record-timer').textContent=recordingSeconds+'s';if(recordingSeconds>=MAX_RECORDING)stopRecording();},1000);}catch(e){document.getElementById('record-status').textContent=COPY[lang].micDenied;}}
  function stopRecording(){if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null;}if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();const btn=document.getElementById('record-btn');btn.classList.remove('recording');btn.innerHTML='🎙️';document.getElementById('record-timer').textContent='';}
  function releaseMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
  function uploadRecording(blob,durationSeconds){const reader=new FileReader();reader.onloadend=()=>{const base64=reader.result.split(',')[1];fetch('/.netlify/functions/save-intake-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'rqs',questionIndex:currentQ,mode:mode,lang:lang,audioBase64:base64,durationSeconds:durationSeconds,mimeType:'audio/webm'})}).catch(err=>console.warn('Recording upload failed:',err));};reader.readAsDataURL(blob);}
</script>

  function declineOffer(){document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem; margin-bottom:1rem;">Grateful you are here. 🌿</p><p style="color:#a3c4a3; font-size:1.05rem; line-height:1.7;">Your piece of the jigsaw is noted. When it feels right, you will know where to find us.<br><br><strong style="color:#86efac;">The others will follow. We will be here waiting for them.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function showFiles(inputId,displayId){document.getElementById(displayId).textContent=Array.from(document.getElementById(inputId).files).map(f=>f.name).join(', ')||'';}
  function resetAll(){stopRecording();releaseMic();document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';mode=null;currentQ=0;audioBlob=null;document.getElementById('lang-screen').classList.remove('hidden');['intro-screen','recorder-screen'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById('record-btn').style.display='flex';document.getElementById('done-msg').style.display='none';}
  async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording'){stopRecording();}else{await startRecording();}}
  async function startRecording(){const c=COPY[lang];if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){document.getElementById('record-status').textContent=c.noSupport;return;}try{if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];audioBlob=null;mediaRecorder=new MediaRecorder(micStream);mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{audioBlob=new Blob(audioChunks,{type:'audio/webm'});const url=URL.createObjectURL(audioBlob);document.getElementById('audio-player').src=url;document.getElementById('playback').classList.remove('hidden');const nb=document.getElementById('next-btn');nb.style.display='inline-block';nb.textContent=(mode==='free'||currentQ>=COPY[lang].questions.length-1)?c.nextDone:c.nextGood;document.getElementById('record-status').textContent=c.recorded(recordingSeconds);uploadRecording(audioBlob,recordingSeconds);};mediaRecorder.start(100);recordingSeconds=0;const btn=document.getElementById('record-btn');btn.classList.add('recording');btn.innerHTML='⏹';document.getElementById('record-status').textContent=c.recording;document.getElementById('record-timer').textContent='';recordingTimer=setInterval(()=>{recordingSeconds++;document.getElementById('record-timer').textContent=recordingSeconds+'s';if(recordingSeconds>=MAX_RECORDING)stopRecording();},1000);}catch(e){document.getElementById('record-status').textContent=COPY[lang].micDenied;}}
  function stopRecording(){if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null;}if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();const btn=document.getElementById('record-btn');btn.classList.remove('recording');btn.innerHTML='🎙️';document.getElementById('record-timer').textContent='';}
  function releaseMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
  function uploadRecording(blob,durationSeconds){const reader=new FileReader();reader.onloadend=()=>{const base64=reader.result.split(',')[1];fetch('/.netlify/functions/save-intake-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'sir-canapa',questionIndex:currentQ,mode:mode,lang:lang,audioBase64:base64,durationSeconds:durationSeconds,mimeType:'audio/webm'})}).catch(err=>console.warn('Recording upload failed:',err));};reader.readAsDataURL(blob);}
</script>

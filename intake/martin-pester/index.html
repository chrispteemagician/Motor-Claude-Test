<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparky — Martin Pester</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a1a0a;color:#c8e6c8;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
  .container{max-width:560px;width:100%;text-align:center;}
  .sparky-name{font-size:1rem;color:#16a34a;letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem;}
  h1{font-size:1.8rem;color:#86efac;margin-bottom:.75rem;line-height:1.3;}
  .intro{color:#a3c4a3;font-size:1.05rem;margin-bottom:2.5rem;line-height:1.6;}
  .lang-choice{display:flex;gap:.75rem;justify-content:center;margin-bottom:2rem;}
  .lang-btn{background:#0f2a0f;border:2px solid #16a34a;color:#86efac;border-radius:10px;padding:.75rem 1.25rem;cursor:pointer;font-size:1rem;transition:background .2s;}
  .lang-btn:hover{background:#163a16;border-color:#86efac;}
  .lang-btn.active{background:#16a34a;color:#0a1a0a;font-weight:700;}
  .mode-choice{display:flex;flex-direction:column;gap:1rem;margin-bottom:2.5rem;}
  .mode-btn{background:#0f2a0f;border:2px solid #16a34a;color:#86efac;border-radius:12px;padding:1.25rem 1.5rem;cursor:pointer;text-align:left;transition:background .2s;}
  .mode-btn:hover{background:#163a16;border-color:#86efac;}
  .mode-btn .mode-title{font-size:1.1rem;font-weight:600;margin-bottom:.3rem;}
  .mode-btn .mode-desc{font-size:.9rem;color:#a3c4a3;}
  .question-text{font-size:1.2rem;color:#86efac;margin-bottom:2rem;line-height:1.5;min-height:3.5rem;}
  .record-btn{width:120px;height:120px;border-radius:50%;border:3px solid #16a34a;background:#0f2a0f;color:#86efac;font-size:3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;transition:all .2s;}
  .record-btn.recording{background:#3a0a0a;border-color:#ef4444;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4);}50%{box-shadow:0 0 0 16px rgba(239,68,68,0);}}
  .record-status{font-size:.95rem;color:#a3c4a3;margin-bottom:.5rem;min-height:1.4rem;}
  .record-timer{font-size:.85rem;color:#16a34a;margin-bottom:1.5rem;min-height:1.2rem;}
  audio{width:100%;margin-bottom:1rem;}
  .next-btn{display:none;background:#16a34a;color:#0a1a0a;border:none;border-radius:8px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;}
  .next-btn:hover{background:#86efac;}
  .done-msg{display:none;color:#86efac;font-size:1.1rem;line-height:1.8;}
  .back-link{display:inline-block;margin-top:2rem;color:#16a34a;font-size:.85rem;cursor:pointer;text-decoration:underline;}
  .share-pitch{background:#0f2a0f;border:1px solid #16a34a;border-radius:12px;padding:1.25rem;margin-bottom:1.5rem;text-align:left;}
  .share-pitch p{font-size:.95rem;color:#a3c4a3;line-height:1.6;}
  .upload-area{border:2px dashed #16a34a;border-radius:10px;padding:1.25rem;margin-bottom:1rem;cursor:pointer;position:relative;}
  .upload-area:hover{background:#0f2a0f;}
  .upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
  .upload-label{font-size:1rem;font-weight:600;color:#86efac;margin-bottom:.3rem;}
  .upload-desc{font-size:.85rem;color:#a3c4a3;}
  .upload-files{font-size:.85rem;color:#16a34a;margin-top:.5rem;min-height:1.2rem;}
  .share-actions{display:flex;flex-direction:column;gap:.75rem;margin-top:.5rem;}
  .share-btn{background:#16a34a;color:#0a1a0a;border:none;border-radius:8px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;}
  .share-btn:hover{background:#86efac;}
  .offer-btn{background:transparent;color:#86efac;border:2px solid #16a34a;border-radius:8px;padding:.85rem 2rem;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s;width:100%;}.offer-btn:hover{background:#0f2a0f;}.skip-link{color:#16a34a;font-size:.85rem;cursor:pointer;text-decoration:underline;}
  .hidden{display:none!important;}
</style>
</head>
<body>
<div class="container">
  <div id="lang-screen">
    <p class="sparky-name">Sparky</p>
    <h1>Willkommen, Martin.</h1>
    <p class="intro" style="margin-bottom:1.5rem;">Wähle deine Sprache, um zu beginnen.</p>
    <div class="lang-choice">
      <button class="lang-btn" onclick="setLang('en',this)">🇬🇧 English</button>
      <button class="lang-btn active" onclick="setLang('de',this)">🇩🇪 Deutsch</button>
      <button class="lang-btn" onclick="setLang('es',this)">🇪🇸 Español</button>
    </div>
    <button class="mode-btn" style="text-align:center;margin-top:.5rem;" onclick="goToIntro()"><div class="mode-title">Weiter →</div></button>
  </div>
  <div id="intro-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="intro-title"></h1><p class="intro" id="intro-body"></p><div class="mode-choice"><button class="mode-btn" onclick="startMode('interview')"><div class="mode-title" id="mode-interview-title"></div><div class="mode-desc" id="mode-interview-desc"></div></button><button class="mode-btn" onclick="startMode('free')"><div class="mode-title" id="mode-free-title"></div><div class="mode-desc" id="mode-free-desc"></div></button></div></div>
  <div id="share-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="share-title"></h1><div class="share-pitch"><p id="share-pitch-text"></p></div><div class="upload-area"><input type="file" id="public-upload" multiple accept=".pdf,.csv,.txt,.jpg,.png" onchange="showFiles('public-upload','public-files')"><div class="upload-label" id="share-public-label"></div><div class="upload-desc" id="share-public-desc"></div><div class="upload-files" id="public-files"></div></div><div class="upload-area"><input type="file" id="private-upload" multiple accept=".pdf,.csv,.txt,.jpg,.png" onchange="showFiles('private-upload','private-files')"><div class="upload-label" id="share-private-label"></div><div class="upload-desc" id="share-private-desc"></div><div class="upload-files" id="private-files"></div></div><div class="share-actions"><button class="share-btn" onclick="finishSession()" id="share-send-btn"></button><span class="skip-link" onclick="finishSession()" id="share-skip-link"></span></div></div>
  <div id="offer-screen" class="hidden"><p class="sparky-name">Sparky</p><h1 id="offer-title"></h1><p class="intro" id="offer-intro"></p><div style="background:#0f2a0f;border:2px solid #16a34a;border-radius:14px;padding:1.5rem;margin-bottom:1.25rem;text-align:left;"><p style="font-size:1.1rem;font-weight:700;color:#86efac;margin-bottom:1rem;" id="offer-trial-headline"></p><ul style="list-style:none;padding:0;color:#c8e6c8;font-size:.95rem;line-height:2;" id="offer-features"></ul></div><div style="background:#0a1a0a;border:1px solid #16a34a;border-radius:10px;padding:1rem;margin-bottom:1.5rem;text-align:left;"><p style="font-size:.9rem;color:#a3c4a3;margin-bottom:.5rem;" id="offer-pricing-label"></p><p style="font-size:1.4rem;font-weight:700;color:#86efac;" id="offer-price-monthly"></p><p style="font-size:.85rem;color:#16a34a;margin-top:.25rem;" id="offer-price-annual"></p></div><div style="background:#0f2a0f;border:1px solid #16a34a;border-radius:10px;padding:1rem;margin-bottom:1.5rem;text-align:left;"><p style="font-size:.95rem;color:#86efac;font-style:italic;line-height:1.6;" id="offer-flywheel"></p></div><div class="share-actions"><button class="share-btn" onclick="declineOffer()" id="offer-static-btn"></button><button class="offer-btn" onclick="acceptOffer()" id="offer-accept-btn"></button></div></div>
  <div id="recorder-screen" class="hidden"><p class="sparky-name">Sparky</p><p class="question-text" id="question-text"></p><button class="record-btn" id="record-btn" onclick="toggleRecording()">🎙️</button><p class="record-status" id="record-status"></p><p class="record-timer" id="record-timer"></p><div id="playback" class="hidden"><audio id="audio-player" controls></audio><button class="next-btn" id="next-btn" onclick="nextQuestion()"></button></div><div class="done-msg" id="done-msg"></div><span class="back-link" id="back-link" onclick="resetAll()"></span></div>
</div>
<script>
  const COPY={
    de:{
      introTitle:"Erzähl mir von deiner Arbeit.",
      introBody:"Du hast dein Puzzlestuck gefunden. Das Nervensystem. Das, was die Mission am Leben halt zwischen den Momenten. Erzahl mir alles.",
      modeInterviewTitle:"🎙️ Sparky stellt die Fragen",modeInterviewDesc:"Eine Frage nach der anderen. Etwa 10 Minuten.",
      modeFreeTitle:"💬 Ich rede einfach",modeFreeDesc:"Drück auf Aufnehmen und erzähl frei.",
      tapToRecord:"Tippen zum Aufnehmen",recording:"Aufnahme läuft…",recorded:s=>`Aufgenommen (${s}s).`,
      nextGood:"Gut so →",nextDone:"Fertig ✓",backLink:"← Neu starten",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">Das ist alles für jetzt. 🌿</p><p style="color:#a3c4a3;"><strong style="color:#86efac;">Keine Panik. Wir haben dich.</strong></p>`,
      micDenied:"Mikrofonzugriff verweigert.",noSupport:"Chrome oder Safari verwenden.",
      questions:[
        "Du bist Klaviyo Certified Partner und baust KI-Automatisierungen für Unternehmen. Was ist der größte Fehler, den Unternehmen mit ihrem E-Mail-Marketing machen, bevor sie zu dir kommen?",
        "Was kann KI-Automatisierung in der Cannabis-Branche leisten, das andere Branchen noch nicht herausgefunden haben?",
        "Wie siehst du eine Zusammenarbeit zwischen deinen Automatisierungssystemen und einer Plattform wie cannabin-oid.co.uk — welche Teile würden zusammenpassen?",
        "Was baust du gerade, das dich am meisten begeistert?",
        "Wenn du mit einem Cannabis-Unternehmen arbeitest, das völlig neu in der E-Mail-Automatisierung ist — was baust du zuerst?"
      ],
      freePrompt:"Drück auf Aufnehmen. Erzähl mir von deiner Arbeit — KI-Automatisierung, Klaviyo, was du für Cannabis-Unternehmen baust.",
      shareTitle:"Hast du Infos zum Teilen?",
      sharePitch:"Wenn Unternehmen auf cannabin-oid nach Automatisierung und Marketing fragen — soll Ask Terp auf deine Arbeit verweisen.",
      sharePublicLabel:"🌿 Mit Ask Terp teilen",sharePublicDesc:"Informationen über deine Dienste, wie KI-Automatisierung funktioniert.",
      sharePrivateLabel:"🔒 Privat behalten",sharePrivateDesc:"Kundendetails, Preise — nur für dein Team.",
      shareSend:"Absenden →",shareSkip:"Nichts zu teilen — überspringen",
      offerTitle:"Eine Mission ohne Nervensystem bleibt in einem Raum.",offerIntro:"Martins Arbeit ist das Bindegewebe zwischen Botschaft und Handlung. Jede Kampagne, die einen Patienten im richtigen Moment erreicht, ist die Rescue Chain bei der Arbeit. Wenn du einen SpicyDrive willst, der auf das aufbaut, was du tust — das ist ein Eins-zu-eins-Gesprach.",
      offerTrialHeadline:"Was ein SpicyDrive fur dich bedeutet:",
      offerFeatures:["🌿 Deine Stimme aufgenommen und in deinen KI-Begleiter eingebaut","🌿 Deine Hamlet-Seite auf cannabin-oid.co.uk","🌿 Eins zu eins gebaut — kein Produkt, eine Zusammenarbeit","🌿 Die Rescue Chain, mit deinen Systemen als Nervensystem"],
      offerPricingLabel:"Dein nachster Schritt:",offerPriceMonthly:"Sag es Chris. Das ist alles.",
      offerPriceAnnual:"Ein Gesprach. Eins zu eins. Keine Formulare.",
      offerFlywheel:'"Die anderen werden folgen. Wir werden hier auf sie warten."',
      offerAccept:"Chris sagen, dass ich einen SpicyDrive will →",offerStatic:"Ich bin erstmal gut — danke"
    },
    en:{
      introTitle:"Tell me about your work.",
      introBody:"You found your piece of the jigsaw. The nervous system. The thing that keeps the mission alive between the moments. Tell me everything.",
      modeInterviewTitle:"🎙️ Let Sparky ask the questions",modeInterviewDesc:"One question at a time. About 10 minutes.",
      modeFreeTitle:"💬 I'll just talk",modeFreeDesc:"Hit record and tell me what's on your mind.",
      tapToRecord:"Tap to start recording",recording:"Recording… tap to stop",
      recorded:s=>`Recorded (${s}s). Listen back, then continue.`,
      nextGood:"That's good →",nextDone:"Done ✓",backLink:"← Start again",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">That's everything for now. 🌿</p><p style="color:#a3c4a3;"><strong style="color:#86efac;">Don't panic. We've got you.</strong></p>`,
      micDenied:"Microphone access denied.",noSupport:"Try Chrome or Safari.",
      questions:[
        "You're a Klaviyo Certified Partner building AI automation pipelines. What's the biggest mistake businesses make with their email marketing before they come to you?",
        "What can AI automation do in the cannabis industry that other industries haven't figured out yet?",
        "How do you see your automation systems connecting with a platform like cannabin-oid.co.uk — what parts would fit together?",
        "What are you currently building that excites you most?",
        "If you were working with a cannabis business that's completely new to email automation — what do you build first?"
      ],
      freePrompt:"Hit record whenever you're ready. Tell me about your work — AI automation, Klaviyo, what you build for cannabis businesses.",
      shareTitle:"Got info to share?",
      sharePitch:"When businesses on cannabin-oid ask about automation and marketing — Ask Terp should mention your services. Share what you want the community to know.",
      sharePublicLabel:"🌿 Share with Ask Terp",sharePublicDesc:"Info about your services and how AI automation connects with cannabis businesses.",
      sharePrivateLabel:"🔒 Keep this private",sharePrivateDesc:"Client details, pricing. Only your hamlet team.",
      shareSend:"Send it →",shareSkip:"Nothing to share — skip",
      offerTitle:"A mission without a nervous system stays in one room.",offerIntro:"Martin's work is the connective tissue between message and action. Every campaign that reaches a patient at the right moment is the rescue chain doing its job. Your piece is the signal that finds people where they are. If you want a SpicyDrive built around what you do, that is a one-to-one conversation.",
      offerTrialHeadline:"What a SpicyDrive looks like for you:",
      offerFeatures:["🌿 Your voice recorded and built into your own AI familiar","🌿 Your hamlet page on cannabin-oid.co.uk","🌿 Built one to one — not a product, a collaboration","🌿 The rescue chain, with your systems as the nervous system"],
      offerPricingLabel:"Your next step:",offerPriceMonthly:"Tell Chris. That is it.",
      offerPriceAnnual:"One conversation. One to one. No forms. No funnels.",
      offerFlywheel:"\"The others will follow. We will be here waiting for them.\"",
      offerAccept:"Tell Chris I want a SpicyDrive →",offerStatic:"I am good for now — thanks"
    },
    es:{
      introTitle:"Cuéntame sobre tu trabajo.",
      introBody:"Encontraste tu pieza del rompecabezas. El sistema nervioso. Lo que mantiene la mision viva entre los momentos. Cuentame todo.",
      modeInterviewTitle:"🎙️ Deja que Sparky pregunte",modeInterviewDesc:"Una pregunta a la vez.",
      modeFreeTitle:"💬 Prefiero hablar libremente",modeFreeDesc:"Dale a grabar.",
      tapToRecord:"Toca para grabar",recording:"Grabando…",recorded:s=>`Grabado (${s}s).`,
      nextGood:"Bien →",nextDone:"Listo ✓",backLink:"← Empezar de nuevo",
      doneMsg:`<p style="font-size:1.4rem;margin-bottom:1rem;">Eso es todo. 🌿</p><p style="color:#a3c4a3;"><strong style="color:#86efac;">Te tenemos.</strong></p>`,
      micDenied:"Acceso al micrófono denegado.",noSupport:"Prueba Chrome o Safari.",
      questions:["Eres Klaviyo Certified Partner y construyes pipelines de automatización con IA. ¿Cuál es el mayor error que cometen las empresas con su email marketing?","¿Qué puede hacer la automatización con IA en el sector cannabis que otras industrias aún no han descubierto?","¿Cómo ves la conexión entre tus sistemas y una plataforma como cannabin-oid.co.uk?","¿Qué estás construyendo ahora que más te emociona?","Si trabajas con una empresa de cannabis nueva en automatización — ¿qué construyes primero?"],
      freePrompt:"Dale a grabar. Cuéntame sobre tu trabajo — IA, Klaviyo, qué construyes para el sector cannabis.",
      shareTitle:"¿Tienes info que compartir?",
      sharePitch:"Cuando las empresas pregunten por automatización — Ask Terp debe mencionar tus servicios.",
      sharePublicLabel:"🌿 Compartir con Ask Terp",sharePublicDesc:"Info sobre tus servicios y cómo conectan con el sector cannabis.",
      sharePrivateLabel:"🔒 Mantener privado",sharePrivateDesc:"Detalles de clientes, precios.",
      shareSend:"Enviar →",shareSkip:"Nada que compartir — saltar",
      offerTitle:"Una mision sin sistema nervioso se queda en una sala.",offerIntro:"El trabajo de Martin es el tejido conectivo entre mensaje y accion. Cada campana que llega a un paciente en el momento adecuado es la cadena de rescate haciendo su trabajo. Si quieres un SpicyDrive construido alrededor de lo que haces, esa es una conversacion uno a uno.",
      offerTrialHeadline:"Lo que un SpicyDrive significa para ti:",
      offerFeatures:["🌿 Tu voz grabada y construida en tu propio familiar de IA","🌿 Tu pagina hamlet en cannabin-oid.co.uk","🌿 Construido uno a uno — no un producto, una colaboracion","🌿 La cadena de rescate, con tus sistemas como sistema nervioso"],
      offerPricingLabel:"Tu siguiente paso:",offerPriceMonthly:"Dile a Chris. Eso es todo.",
      offerPriceAnnual:"Una conversacion. Uno a uno. Sin formularios.",
      offerFlywheel:'"Los demas vendran. Aqui estaremos esperandolos."',
      offerAccept:"Decirle a Chris que quiero un SpicyDrive →",offerStatic:"Por ahora estoy bien — gracias"
    }
  };
  let lang='de',mode=null,currentQ=0,mediaRecorder=null,audioChunks=[],audioBlob=null,recordingTimer=null,recordingSeconds=0,micStream=null;
  const MAX_RECORDING=180;
  function setLang(l,btn){lang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  function goToIntro(){const c=COPY[lang];document.getElementById('intro-title').textContent=c.introTitle;document.getElementById('intro-body').textContent=c.introBody;document.getElementById('mode-interview-title').textContent=c.modeInterviewTitle;document.getElementById('mode-interview-desc').textContent=c.modeInterviewDesc;document.getElementById('mode-free-title').textContent=c.modeFreeTitle;document.getElementById('mode-free-desc').textContent=c.modeFreeDesc;document.getElementById('lang-screen').classList.add('hidden');document.getElementById('intro-screen').classList.remove('hidden');}
  function startMode(m){mode=m;currentQ=0;document.getElementById('intro-screen').classList.add('hidden');document.getElementById('recorder-screen').classList.remove('hidden');document.getElementById('back-link').textContent=COPY[lang].backLink;document.getElementById('record-status').textContent=COPY[lang].tapToRecord;showQuestion();}
  function showQuestion(){document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';document.getElementById('playback').classList.add('hidden');document.getElementById('next-btn').style.display='none';document.getElementById('done-msg').style.display='none';document.getElementById('record-status').textContent=COPY[lang].tapToRecord;document.getElementById('record-timer').textContent='';document.getElementById('question-text').textContent=mode==='free'?COPY[lang].freePrompt:COPY[lang].questions[currentQ];}
  function nextQuestion(){document.getElementById('audio-player').pause();document.getElementById('audio-player').src='';if(mode==='free'){endSession();return;}currentQ++;if(currentQ>=COPY[lang].questions.length)endSession();else showQuestion();}
  function endSession(){releaseMic();document.getElementById('recorder-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('share-title').textContent=c.shareTitle;document.getElementById('share-pitch-text').innerHTML=c.sharePitch;document.getElementById('share-public-label').textContent=c.sharePublicLabel;document.getElementById('share-public-desc').textContent=c.sharePublicDesc;document.getElementById('share-private-label').textContent=c.sharePrivateLabel;document.getElementById('share-private-desc').textContent=c.sharePrivateDesc;document.getElementById('share-send-btn').textContent=c.shareSend;document.getElementById('share-skip-link').textContent=c.shareSkip;document.getElementById('share-screen').classList.remove('hidden');}
  function finishSession(){document.getElementById('share-screen').classList.add('hidden');const c=COPY[lang];document.getElementById('offer-title').textContent=c.offerTitle;document.getElementById('offer-intro').textContent=c.offerIntro;document.getElementById('offer-trial-headline').textContent=c.offerTrialHeadline;document.getElementById('offer-features').innerHTML=c.offerFeatures.map(f=>`<li>${f}</li>`).join('');document.getElementById('offer-pricing-label').textContent=c.offerPricingLabel;document.getElementById('offer-price-monthly').textContent=c.offerPriceMonthly;document.getElementById('offer-price-annual').textContent=c.offerPriceAnnual;document.getElementById('offer-flywheel').textContent=c.offerFlywheel;document.getElementById('offer-accept-btn').textContent=c.offerAccept;document.getElementById('offer-static-btn').textContent=c.offerStatic;document.getElementById('offer-screen').classList.remove('hidden');}
  function acceptOffer(){document.getElementById('offer-screen').classList.add('hidden');window.open('https://wa.me/447976884254?text=Hi+Chris%2C+it%27s+Martin+Pester.+I+want+a+SpicyDrive.','_blank');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem;margin-bottom:1rem;">On its way. 🌿</p><p style="color:#a3c4a3;font-size:1.05rem;line-height:1.7;"><strong style="color:#86efac;">Chris will be in touch.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function declineOffer(){document.getElementById('offer-screen').classList.add('hidden');document.getElementById('done-msg').innerHTML=`<p style="font-size:1.4rem;margin-bottom:1rem;">Grateful you are here. 🌿</p><p style="color:#a3c4a3;font-size:1.05rem;line-height:1.7;"><strong style="color:#86efac;">The others will follow. We will be here waiting for them.</strong></p>`;document.getElementById('done-msg').style.display='block';}
  function showFiles(i,d){document.getElementById(d).textContent=Array.from(document.getElementById(i).files).map(f=>f.name).join(', ')||'';}
  function resetAll(){stopRecording();releaseMic();mode=null;currentQ=0;document.getElementById('lang-screen').classList.remove('hidden');['intro-screen','recorder-screen'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById('done-msg').style.display='none';}
  async function toggleRecording(){if(mediaRecorder&&mediaRecorder.state==='recording')stopRecording();else await startRecording();}
  async function startRecording(){const c=COPY[lang];if(!navigator.mediaDevices){document.getElementById('record-status').textContent=c.noSupport;return;}try{if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:true});audioChunks=[];mediaRecorder=new MediaRecorder(micStream);mediaRecorder.ondataavailable=e=>{if(e.data.size>0)audioChunks.push(e.data);};mediaRecorder.onstop=()=>{document.getElementById('audio-player').src=URL.createObjectURL(new Blob(audioChunks,{type:'audio/webm'}));document.getElementById('playback').classList.remove('hidden');const nb=document.getElementById('next-btn');nb.style.display='inline-block';nb.textContent=(mode==='free'||currentQ>=COPY[lang].questions.length-1)?c.nextDone:c.nextGood;document.getElementById('record-status').textContent=c.recorded(recordingSeconds);uploadRecording(audioBlob,recordingSeconds);};mediaRecorder.start(100);recordingSeconds=0;document.getElementById('record-btn').classList.add('recording');document.getElementById('record-btn').innerHTML='⏹';document.getElementById('record-status').textContent=c.recording;recordingTimer=setInterval(()=>{recordingSeconds++;document.getElementById('record-timer').textContent=recordingSeconds+'s';if(recordingSeconds>=MAX_RECORDING)stopRecording();},1000);}catch(e){document.getElementById('record-status').textContent=c.micDenied;}}
  function stopRecording(){if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null;}if(mediaRecorder&&mediaRecorder.state==='recording')mediaRecorder.stop();document.getElementById('record-btn').classList.remove('racing');document.getElementById('record-btn').classList.remove('recording');document.getElementById('record-btn').innerHTML='🎙️';document.getElementById('record-timer').textContent='';}
  function releaseMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
  function uploadRecording(blob,durationSeconds){const reader=new FileReader();reader.onloadend=()=>{const base64=reader.result.split(',')[1];fetch('/.netlify/functions/save-intake-recording',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug:'martin-pester',questionIndex:currentQ,mode:mode,lang:lang,audioBase64:base64,durationSeconds:durationSeconds,mimeType:'audio/webm'})}).catch(err=>console.warn('Recording upload failed:',err));};reader.readAsDataURL(blob);}
</script>

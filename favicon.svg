<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- motor-oid favicon — steering wheel, orange -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F97316" stroke-width="9"/>
  <!-- 12 o'clock spoke -->
  <line x1="50" y1="11" x2="50" y2="39" stroke="#F97316" stroke-width="9" stroke-linecap="round"/>
  <!-- 4 o'clock spoke -->
  <line x1="59.5" y1="55.5" x2="83.8" y2="69.5" stroke="#F97316" stroke-width="9" stroke-linecap="round"/>
  <!-- 8 o'clock spoke -->
  <line x1="40.5" y1="55.5" x2="16.2" y2="69.5" stroke="#F97316" stroke-width="9" stroke-linecap="round"/>
  <!-- Centre hub -->
  <circle cx="50" cy="50" r="11" fill="#F97316"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Your Garage | Motor-Oid Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --deep: #0f0f0f; --mid: #1a1a1a;
            --accent: #f97316; --silver: #94a3b8; --cream: #e2e8f0;
            --green: #22c55e; --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--deep); color: var(--cream); min-height: 100vh; font-size: 18px; }
        .font-hand { font-family: 'Caveat', cursive; }
        .header { text-align: center; padding: 60px 20px 20px; }
        .header h1 { font-family: 'Caveat', cursive; font-size: clamp(2rem, 7vw, 3rem); color: var(--accent); }
        .header p { color: var(--silver); margin-top: 8px; }
        .container { max-width: 560px; margin: 0 auto; padding: 0 20px 60px; }
        .card { background: var(--mid); border: 1px solid #2d2d2d; border-radius: 12px; padding: 28px; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; }
        input, textarea, select {
            width: 100%; background: #111; border: 1px solid #333; color: var(--cream);
            border-radius: 8px; padding: 12px; font-family: 'Outfit', sans-serif;
            font-size: 0.9rem; margin-bottom: 16px; transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
        .btn-primary {
            width: 100%; background: var(--accent); color: #000; font-weight: 700;
            padding: 14px; border-radius: 10px; border: none; cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 1rem; min-height: 48px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .msg { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-top: 12px; display: none; }
        .msg.success { background: rgba(34,197,94,0.1); border: 1px solid var(--green); color: var(--green); }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); }
        .back-link { text-align: center; margin-bottom: 20px; }
        .back-link a { color: var(--silver); font-size: 0.9rem; }
    </style>
</head>
<body>
<script src="/banner.js"></script>
<div class="header">
    <div style="font-size:3rem; margin-bottom:12px;">🔧</div>
    <h1>Open Your Garage</h1>
    <p>Your corner of the Motor-Oid Village. Free forever.</p>
</div>

<div class="container">
    <div class="back-link"><a href="/index.html">← Back to Motor-Oid</a></div>

    <div class="card" id="formCard">
        <div style="margin-bottom:20px;">
            <label>Garage Name *</label>
            <input type="text" id="garageName" placeholder="e.g. Dave's Garage, Bristol Classics, The VW Shed" maxlength="60">
            <label>Your Speciality</label>
            <input type="text" id="garageCraft" placeholder="e.g. VW campers, classic Fords, EV conversions" maxlength="80">
            <label>Garage Emoji</label>
            <input type="text" id="garageEmoji" placeholder="🔧" maxlength="4" style="width:80px; margin-bottom:16px;">
            <label>About your Garage <span style="color:var(--silver); font-weight:400;">(optional)</span></label>
            <textarea id="garageAbout" rows="3" placeholder="Tell the village about your garage — what you know, what you love, what you'll help with..."></textarea>
            <label>Your Name *</label>
            <input type="text" id="ownerName" placeholder="Your name (shows on the garage page)" maxlength="60">
            <label>Email *</label>
            <input type="email" id="ownerEmail" placeholder="your@email.com">
        </div>
        <button class="btn-primary" onclick="createGarage()">🔧 Open My Garage</button>
        <div class="msg" id="formMsg"></div>
    </div>

    <div class="card" id="successCard" style="display:none; text-align:center;">
        <div style="font-size:3rem; margin-bottom:16px;">🎉</div>
        <h2 class="font-hand" style="font-size:2rem; color:var(--accent); margin-bottom:8px;">Garage is Open!</h2>
        <p style="color:var(--silver); margin-bottom:20px;">Spanner Jack has noted your garage. Here's your link:</p>
        <div style="background:#111; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:20px; word-break:break-all;">
            <a id="garageUrl" href="#" style="color:var(--accent); font-weight:700; font-size:0.95rem;"></a>
        </div>
        <p style="color:var(--silver); font-size:0.85rem; margin-bottom:16px;">Bookmark your edit link too — that's how you customise it:</p>
        <div style="background:#111; border:1px solid #333; border-radius:8px; padding:12px; word-break:break-all;">
            <a id="editUrl" href="#" style="color:var(--silver); font-size:0.85rem;"></a>
        </div>
        <p style="color:var(--silver); font-size:0.8rem; margin-top:16px;">A welcome email is on its way too.</p>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://pdnjeynugptnavkdbmxh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkbmpleW51Z3B0bmF2a2RibXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMTEzMDAsImV4cCI6MjA4NDU4NzMwMH0.GawisR01EykMtdauBMxenmHF2NXDMzDOJl8WgzkwFQo';
let supabase = null;
try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').substring(0, 40);
}

function showMsg(text, type) {
    const el = document.getElementById('formMsg');
    el.textContent = text; el.className = `msg ${type}`; el.style.display = 'block';
}

async function createGarage() {
    const name = document.getElementById('garageName').value.trim();
    const craft = document.getElementById('garageCraft').value.trim();
    const emoji = document.getElementById('garageEmoji').value.trim() || '🔧';
    const about = document.getElementById('garageAbout').value.trim();
    const ownerName = document.getElementById('ownerName').value.trim();
    const email = document.getElementById('ownerEmail').value.trim();

    if (!name) { showMsg('Garage name is required', 'error'); return; }
    if (!ownerName) { showMsg('Your name is required', 'error'); return; }
    if (!email || !email.includes('@')) { showMsg('Valid email is required', 'error'); return; }
    if (!supabase) { showMsg('Connection error — try again', 'error'); return; }

    const slug = slugify(name);
    const editToken = Math.random().toString(36).substring(2, 14) + Math.random().toString(36).substring(2, 8);

    try {
        const { error } = await supabase.from('hamlets').insert({
            slug, name, craft, emoji, about,
            owner_name: ownerName, owner_email: email,
            village_slug: 'motor', edit_token: editToken,
            created_at: new Date().toISOString()
        });

        if (error) {
            if (error.code === '23505') { showMsg('That garage name is taken — try a different one', 'error'); }
            else { showMsg('Error creating garage: ' + error.message, 'error'); }
            return;
        }

        // Send welcome email
        try {
            await fetch('/.netlify/functions/hamlet-welcome', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, name: ownerName, hamlet: slug })
            });
        } catch(e) { /* silent */ }

        const garageLink = `https://motor-oid.co.uk/hamlet/${slug}`;
        const editLink = `https://motor-oid.co.uk/hamlet/edit?slug=${slug}&token=${editToken}`;

        document.getElementById('garageUrl').textContent = garageLink;
        document.getElementById('garageUrl').href = garageLink;
        document.getElementById('editUrl').textContent = editLink;
        document.getElementById('editUrl').href = editLink;
        document.getElementById('formCard').style.display = 'none';
        document.getElementById('successCard').style.display = 'block';

    } catch(e) {
        showMsg('Something went wrong — try again', 'error');
        console.error(e);
    }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Your Garage | Motor-Oid Village</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --deep: #0f0f0f; --mid: #1a1a1a;
            --accent: #f97316; --silver: #94a3b8; --cream: #e2e8f0;
            --green: #22c55e; --red: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: var(--deep); color: var(--cream); min-height: 100vh; font-size: 18px; }
        .font-hand { font-family: 'Caveat', cursive; }
        .header { text-align: center; padding: 40px 20px 10px; }
        .header h1 { font-family: 'Caveat', cursive; font-size: clamp(2rem, 7vw, 3rem); color: var(--accent); }
        .header p { color: var(--silver); margin-top: 6px; }
        .container { max-width: 560px; margin: 0 auto; padding: 20px 20px 60px; }
        .card { background: var(--mid); border: 1px solid #2d2d2d; border-radius: 12px; padding: 28px; margin-bottom: 20px; }
        label { font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 6px; }
        input, textarea {
            width: 100%; background: #111; border: 1px solid #333; color: var(--cream);
            border-radius: 8px; padding: 12px; font-family: 'Outfit', sans-serif;
            font-size: 0.9rem; margin-bottom: 16px; transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }
        .btn-primary {
            background: var(--accent); color: #000; font-weight: 700;
            padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer;
            font-family: 'Outfit', sans-serif; font-size: 0.9rem; min-height: 48px;
        }
        .btn-primary:hover { opacity: 0.9; }
        .msg { padding: 12px 16px; border-radius: 8px; font-size: 0.9rem; margin-top: 12px; display: none; }
        .msg.success { background: rgba(34,197,94,0.1); border: 1px solid var(--green); color: var(--green); }
        .msg.error { background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); }
        #authError { text-align: center; padding: 60px 20px; color: var(--silver); }
        #authError h2 { font-family: 'Caveat', cursive; font-size: 2rem; color: var(--red); margin-bottom:12px; }
    </style>
</head>
<body>
<script src="/banner.js"></script>
<div class="header">
    <div style="font-size:3rem; margin-bottom:12px;">🔧</div>
    <h1>Edit Your Garage</h1>
    <p id="garageSubtitle" style="color:var(--accent);"></p>
</div>

<div id="authError" style="display:none;">
    <h2>Not Authorised</h2>
    <p>This edit link is invalid or expired.<br>Reply to your welcome email and we'll sort it.</p>
    <a href="/index.html" style="color:var(--accent); margin-top:20px; display:inline-block;">← Motor-Oid</a>
</div>

<div id="editForm" style="display:none;">
<div class="container">
    <div style="margin-bottom:16px; text-align:center;">
        <a id="viewLink" href="#" style="color:var(--silver); font-size:0.9rem;">View your garage →</a>
    </div>
    <div class="card">
        <label>Garage Name</label>
        <input type="text" id="editName" maxlength="60">
        <label>Speciality</label>
        <input type="text" id="editCraft" maxlength="80">
        <label>Emoji</label>
        <input type="text" id="editEmoji" maxlength="4" style="width:80px;">
        <label style="margin-top:16px;">About your Garage</label>
        <textarea id="editAbout" rows="4"></textarea>
        <button class="btn-primary" onclick="saveGarage()">💾 Save Changes</button>
        <div class="msg" id="editMsg"></div>
    </div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://pdnjeynugptnavkdbmxh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkbmpleW51Z3B0bmF2a2RibXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwMTEzMDAsImV4cCI6MjA4NDU4NzMwMH0.GawisR01EykMtdauBMxenmHF2NXDMzDOJl8WgzkwFQo';
let supabase = null;
try { supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch(e) {}

let currentSlug = null;

async function loadGarage() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const token = params.get('token');

    if (!slug || !token || !supabase) { showAuthError(); return; }

    const { data, error } = await supabase
        .from('hamlets')
        .select('*')
        .eq('slug', slug)
        .eq('edit_token', token)
        .eq('village_slug', 'motor')
        .maybeSingle();

    if (error || !data) { showAuthError(); return; }

    currentSlug = slug;
    document.getElementById('garageSubtitle').textContent = data.name;
    document.getElementById('editName').value = data.name || '';
    document.getElementById('editCraft').value = data.craft || '';
    document.getElementById('editEmoji').value = data.emoji || '🔧';
    document.getElementById('editAbout').value = data.about || '';
    document.getElementById('viewLink').href = `/hamlet/${slug}`;
    document.getElementById('editForm').style.display = 'block';
}

async function saveGarage() {
    if (!supabase || !currentSlug) return;
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const updates = {
        name: document.getElementById('editName').value.trim(),
        craft: document.getElementById('editCraft').value.trim(),
        emoji: document.getElementById('editEmoji').value.trim() || '🔧',
        about: document.getElementById('editAbout').value.trim(),
        updated_at: new Date().toISOString()
    };

    const { error } = await supabase.from('hamlets')
        .update(updates)
        .eq('slug', currentSlug)
        .eq('edit_token', token);

    const msg = document.getElementById('editMsg');
    if (error) {
        msg.textContent = 'Error saving: ' + error.message;
        msg.className = 'msg error'; msg.style.display = 'block';
    } else {
        msg.textContent = 'Saved! ✓';
        msg.className = 'msg success'; msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
    }
}

function showAuthError() {
    document.getElementById('authError').style.display = 'block';
}

document.addEventListener('DOMContentLoaded', loadGarage);
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <!-- motor-oid sticker logo — dark background, orange steering wheel -->
  <rect width="200" height="280" rx="24" fill="#111827"/>

  <!-- Steering wheel, centred at 100,115 -->
  <g transform="translate(100,115)">
    <circle r="58" fill="none" stroke="#F97316" stroke-width="11"/>
    <!-- 12 o'clock -->
    <line x1="0" y1="-14" x2="0" y2="-49" stroke="#F97316" stroke-width="11" stroke-linecap="round"/>
    <!-- 4 o'clock -->
    <line x1="12.1" y1="7" x2="42.4" y2="24.5" stroke="#F97316" stroke-width="11" stroke-linecap="round"/>
    <!-- 8 o'clock -->
    <line x1="-12.1" y1="7" x2="-42.4" y2="24.5" stroke="#F97316" stroke-width="11" stroke-linecap="round"/>
    <!-- Hub -->
    <circle r="14" fill="#F97316"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="218" text-anchor="middle"
        font-family="system-ui, -apple-system, Arial, sans-serif"
        font-weight="700" font-size="34" letter-spacing="-0.5">
    <tspan fill="#F97316">motor</tspan><tspan fill="#ffffff">-oid</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="252" text-anchor="middle"
        font-family="system-ui, -apple-system, Arial, sans-serif"
        font-weight="400" font-size="13" fill="#6b7280" letter-spacing="2">
    KNOW WHAT IT'S WORTH
  </text>
</svg>

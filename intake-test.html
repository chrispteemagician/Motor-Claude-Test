<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sparky — Voice Intake Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a1a0a;
    color: #c8e6c8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    max-width: 560px;
    width: 100%;
    text-align: center;
  }

  .sparky-name {
    font-size: 1rem;
    color: #16a34a;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  h1 {
    font-size: 1.8rem;
    color: #86efac;
    margin-bottom: 0.75rem;
    line-height: 1.3;
  }

  .intro {
    color: #a3c4a3;
    font-size: 1.05rem;
    margin-bottom: 2.5rem;
    line-height: 1.6;
  }

  /* MODE CHOICE */
  .mode-choice {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2.5rem;
  }

  .mode-btn {
    background: #0f2a0f;
    border: 2px solid #16a34a;
    color: #86efac;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    cursor: pointer;
    text-align: left;
    transition: background 0.2s, border-color 0.2s;
  }

  .mode-btn:hover {
    background: #163a16;
    border-color: #86efac;
  }

  .mode-btn .mode-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }

  .mode-btn .mode-desc {
    font-size: 0.9rem;
    color: #a3c4a3;
  }

  /* RECORDER */
  .recorder {
    display: none;
  }

  .question-text {
    font-size: 1.2rem;
    color: #86efac;
    margin-bottom: 2rem;
    line-height: 1.5;
    min-height: 3.5rem;
  }

  .record-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid #16a34a;
    background: #0f2a0f;
    color: #86efac;
    font-size: 3rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
  }

  .record-btn:hover {
    background: #163a16;
    border-color: #86efac;
  }

  .record-btn.recording {
    background: #3a0a0a;
    border-color: #ef4444;
    animation: pulse 1.2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
  }

  .record-status {
    font-size: 0.95rem;
    color: #a3c4a3;
    margin-bottom: 0.5rem;
    min-height: 1.4rem;
  }

  .record-timer {
    font-size: 0.85rem;
    color: #16a34a;
    margin-bottom: 1.5rem;
    min-height: 1.2rem;
  }

  .playback {
    display: none;
    margin: 1rem auto;
    width: 100%;
  }

  audio {
    width: 100%;
    margin-bottom: 1rem;
  }

  .next-btn {
    display: none;
    background: #16a34a;
    color: #0a1a0a;
    border: none;
    border-radius: 8px;
    padding: 0.85rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .next-btn:hover {
    background: #86efac;
  }

  .done-msg {
    display: none;
    color: #86efac;
    font-size: 1.2rem;
    margin-top: 1rem;
  }

  .back-link {
    display: inline-block;
    margin-top: 2rem;
    color: #16a34a;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="container">

  <!-- INTRO -->
  <div id="intro-screen">
    <p class="sparky-name">Sparky</p>
    <h1>Tell me about your business.</h1>
    <p class="intro">I'll listen. I won't share anything you say. This is just between us.</p>

    <div class="mode-choice">
      <button class="mode-btn" onclick="startMode('interview')">
        <div class="mode-title">🎙️ Let Sparky ask the questions</div>
        <div class="mode-desc">I'll guide you through it — one question at a time. Takes about 10 minutes.</div>
      </button>
      <button class="mode-btn" onclick="startMode('free')">
        <div class="mode-title">💬 I'll just talk</div>
        <div class="mode-desc">Hit record and tell me whatever's on your mind. No questions. No structure. Just talk.</div>
      </button>
    </div>
  </div>

  <!-- RECORDER -->
  <div class="recorder" id="recorder-screen">
    <p class="sparky-name">Sparky</p>
    <p class="question-text" id="question-text"></p>

    <button class="record-btn" id="record-btn" onclick="toggleRecording()" aria-label="Start recording">
      🎙️
    </button>

    <p class="record-status" id="record-status">Tap to start recording</p>
    <p class="record-timer" id="record-timer"></p>

    <div class="playback" id="playback">
      <audio id="audio-player" controls></audio>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">That's good →</button>
    </div>

    <p class="done-msg" id="done-msg">That's everything. Thank you. 🌿</p>

    <span class="back-link" onclick="resetAll()">← Start again</span>
  </div>

</div>

<script>
  // ── QUESTIONS ──────────────────────────────────────────────────────────────
  const INTERVIEW_QUESTIONS = [
    "Tell me about your business. How did it start?",
    "What do you actually love about the work? The bit that makes it worth it.",
    "What's the hardest part? The thing that sometimes makes you wonder why you bother.",
    "Give me your sales pitch. If a friend asked what you do, what would you say?",
    "Is there anything else — hours, where to find you, what makes you different from everyone else doing the same thing?"
  ];

  const FREE_QUESTION = "Hit record whenever you're ready. Tell me whatever's on your mind — your business, your story, anything you want people to know.";

  let mode = null;
  let currentQ = 0;
  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlob = null;
  let recordingTimer = null;
  let recordingSeconds = 0;
  let micStream = null; // kept alive for whole session — avoids repeated permission prompts
  const MAX_RECORDING = 180; // 3 minutes per answer

  // ── MODE SELECT ────────────────────────────────────────────────────────────
  function startMode(selectedMode) {
    mode = selectedMode;
    currentQ = 0;
    document.getElementById('intro-screen').style.display = 'none';
    document.getElementById('recorder-screen').style.display = 'block';
    showQuestion();
  }

  function showQuestion() {
    const questionEl = document.getElementById('question-text');
    const nextBtn = document.getElementById('next-btn');
    const doneMsg = document.getElementById('done-msg');
    const playback = document.getElementById('playback');

    nextBtn.style.display = 'none';
    doneMsg.style.display = 'none';
    playback.style.display = 'none';
    document.getElementById('record-status').textContent = 'Tap to start recording';
    document.getElementById('record-timer').textContent = '';
    audioBlob = null;

    if (mode === 'free') {
      questionEl.textContent = FREE_QUESTION;
    } else {
      questionEl.textContent = INTERVIEW_QUESTIONS[currentQ];
    }
  }

  function nextQuestion() {
    // stop any audio that's still playing
    const player = document.getElementById('audio-player');
    player.pause();
    player.src = '';

    if (mode === 'free') {
      endSession();
      return;
    }
    currentQ++;
    if (currentQ >= INTERVIEW_QUESTIONS.length) {
      endSession();
    } else {
      showQuestion();
    }
  }

  function endSession() {
    releaseMic();
    document.getElementById('record-btn').style.display = 'none';
    document.getElementById('question-text').textContent = '';
    document.getElementById('record-status').textContent = '';
    document.getElementById('playback').style.display = 'none';
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('done-msg').innerHTML = `
      <p style="font-size:1.4rem; margin-bottom:1rem;">That's everything for now. 🌿</p>
      <p style="color:#a3c4a3; font-size:1.05rem; line-height:1.7;">Trinity are going to work their magic.<br>We'll be right back with something brilliant.<br><br><strong style="color:#86efac;">Don't panic. We've got you.</strong></p>
    `;
    document.getElementById('done-msg').style.display = 'block';
  }

  function resetAll() {
    stopRecording();
    releaseMic();
    const player = document.getElementById('audio-player');
    player.pause();
    player.src = '';
    mode = null;
    currentQ = 0;
    audioBlob = null;
    document.getElementById('intro-screen').style.display = 'block';
    document.getElementById('recorder-screen').style.display = 'none';
    document.getElementById('record-btn').style.display = 'flex';
    document.getElementById('done-msg').style.display = 'none';
  }

  function releaseMic() {
    if (micStream) {
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
  }

  // ── RECORDING ──────────────────────────────────────────────────────────────
  async function toggleRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecording();
    } else {
      await startRecording();
    }
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      document.getElementById('record-status').textContent = 'Your browser does not support recording. Try Chrome or Safari.';
      return;
    }
    try {
      // reuse existing stream if we already have permission — no re-prompt
      if (!micStream) {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      audioChunks = [];
      audioBlob = null;
      mediaRecorder = new MediaRecorder(micStream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

        // show playback
        const url = URL.createObjectURL(audioBlob);
        const player = document.getElementById('audio-player');
        player.src = url;
        document.getElementById('playback').style.display = 'block';
        document.getElementById('next-btn').style.display = 'inline-block';

        const isLast = mode === 'free' || currentQ >= INTERVIEW_QUESTIONS.length - 1;
        document.getElementById('next-btn').textContent = isLast ? 'Done ✓' : 'That\'s good →';
        document.getElementById('record-status').textContent = `Recorded (${recordingSeconds}s). Listen back, then continue.`;
      };
      mediaRecorder.start(100);
      recordingSeconds = 0;

      const btn = document.getElementById('record-btn');
      btn.classList.add('recording');
      btn.innerHTML = '⏹';
      btn.setAttribute('aria-label', 'Stop recording');
      document.getElementById('record-status').textContent = 'Recording… tap to stop';
      document.getElementById('record-timer').textContent = '';

      recordingTimer = setInterval(() => {
        recordingSeconds++;
        document.getElementById('record-timer').textContent = recordingSeconds + 's';
        if (recordingSeconds >= MAX_RECORDING) stopRecording();
      }, 1000);

    } catch (e) {
      document.getElementById('record-status').textContent = 'Microphone access denied — allow mic access and try again.';
    }
  }

  function stopRecording() {
    if (recordingTimer) { clearInterval(recordingTimer); recordingTimer = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    const btn = document.getElementById('record-btn');
    btn.classList.remove('recording');
    btn.innerHTML = '🎙️';
    btn.setAttribute('aria-label', 'Start recording');
    document.getElementById('record-timer').textContent = '';
  }
</script>

</body>
</html>

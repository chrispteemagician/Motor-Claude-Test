<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Cannabin-Oid — The Village</title>
    <link rel="icon" type="image/jpeg" href="cannabin-oid.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            background: #030a03;
            color: #c8e6c8;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px max(80px, env(safe-area-inset-bottom, 80px));
            min-height: 100dvh;
        }

        /* Top — domain */
        .domain {
            text-align: center;
            width: 100%;
        }
        .domain .url {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: clamp(1.8rem, 7.5vw, 3.2rem);
            color: #86efac;
            line-height: 1;
            letter-spacing: -0.01em;
        }
        .domain .tagline {
            font-size: clamp(0.8rem, 3vw, 1rem);
            color: #6b9e6b;
            margin-top: 6px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* Middle — the truth */
        .message {
            text-align: center;
            max-width: 440px;
            width: 100%;
            padding: 0 8px;
        }
        .message p {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: clamp(1.5rem, 6vw, 2.4rem);
            color: #f0f7f0;
            line-height: 1.35;
            margin-bottom: 12px;
        }
        .message p:last-child { margin-bottom: 0; }
        .message p.accent { color: #86efac; }
        .dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #16a34a;
            border-radius: 50%;
            margin: 0 8px;
            vertical-align: middle;
        }

        /* Bottom — QR */
        .qr-zone {
            text-align: center;
            width: 100%;
        }
        .qr-wrap {
            display: inline-block;
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .qr-wrap img {
            display: block;
            width: clamp(130px, 34vw, 190px);
            height: clamp(130px, 34vw, 190px);
        }
        .qr-caption {
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            color: #6b9e6b;
            font-weight: 300;
        }
        .qr-caption strong {
            color: #86efac;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Top: the domain -->
    <div class="domain">
        <div class="url">cannabin-oid.co.uk</div>
        <div class="tagline">The cannabis village <span class="dot"></span> No algorithm <span class="dot"></span> No surveillance</div>
    </div>

    <!-- Middle: the truth -->
    <div class="message">
        <p>I built a decentralised network for stoners to escape social media.</p>
        <p class="accent">I built AI for stoners who want to be smarter than the system.</p>
    </div>

    <!-- Bottom: QR -->
    <div class="qr-zone">
        <div class="qr-wrap">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://cannabin-oid.co.uk&color=030a03&bgcolor=ffffff&margin=10&format=jpg" alt="Scan to visit cannabin-oid.co.uk" style="border-radius:8px;">
        </div>
        <p class="qr-caption">Photograph this. <strong>Come find us when you're ready.</strong></p>
    </div>


</body>
</html>
